<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">SmartContable</title>
  <desc id="desc">Logo oficial de SmartContable - Inteligencia Contable y Fiscal</desc>
  <defs>
    <!-- Gradientes de Fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091224"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowBackdrop" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradientes del Emblema Principal -->
    <linearGradient id="primaryTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="primaryMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="primaryBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Sombras de Profundidad -->
    <filter id="shadowEmblem" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="glowSpark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor Base con Margen de Seguridad Maskable para PWA -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="url(#glowBackdrop)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1"/>

  <!-- Aro decorativo sutil de tecnología contable -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.45"/>

  <!-- Emblema Principal: "S" Geométrica Contable & Capas de Pólizas -->
  <g filter="url(#shadowEmblem)">
    <!-- Ala Superior (Ingresos & Facturación) -->
    <path d="M 176 138 
             L 310 138 
             C 346 138, 374 166, 374 202 
             C 374 238, 346 266, 310 266 
             L 242 266 
             C 214 266, 192 288, 192 316 
             L 192 338 
             L 152 298 
             L 152 162 
             C 152 148, 162 138, 176 138 Z" 
          fill="url(#primaryTop)"/>

    <!-- Ala Inferior (Gastos, Conciliación y Pólizas) -->
    <path d="M 336 374 
             L 202 374 
             C 166 374, 138 346, 138 310 
             C 138 274, 166 246, 202 246 
             L 270 246 
             C 298 246, 320 224, 320 196 
             L 320 174 
             L 360 214 
             L 360 350 
             C 360 364, 350 374, 336 374 Z" 
          fill="url(#primaryBottom)"/>

    <!-- Puente Central Isométrico (Cruce & Conciliación Contable) -->
    <path d="M 198 246 
             L 314 246 
             C 336 246, 354 264, 354 286 
             L 354 290 
             C 354 312, 336 330, 314 330 
             L 198 330 
             C 176 330, 158 312, 158 290 
             L 158 286 
             C 158 264, 176 246, 198 246 Z" 
          fill="url(#primaryMid)" 
          opacity="0.95"/>

    <!-- Barras de registro contable y balance -->
    <rect x="204" y="174" width="76" height="12" rx="6" fill="url(#barGleam)"/>
    <rect x="204" y="202" width="48" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
    
    <rect x="232" y="300" width="76" height="12" rx="6" fill="url(#barGleam)"/>
    <rect x="260" y="328" width="48" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Destello de Inteligencia Fiscal SAT (Smart AI Spark) -->
  <g filter="url(#glowSpark)" transform="translate(378, 128)">
    <path d="M 0 -26 
             C 1.5 -10, 10 -1.5, 26 0 
             C 10 1.5, 1.5 10, 0 26 
             C -1.5 10, -10 1.5, -26 0 
             C -10 -1.5, -1.5 -10, 0 -26 Z" 
          fill="url(#sparkGrad)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>
</svg>